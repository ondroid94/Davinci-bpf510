name: NEW
on:
  workflow_dispatch:
    inputs:
      DEPLOY_DEVICE_TYPE:
        description: 'Deploy Device Type (DAVINCI)'
        required: true
        default: 'DAVINCI'
      DEPLOY_TAG_TYPE:
        description: 'Deploy Kernel version tag (example: v1 or v2)'
        required: true

env:
  CHATID: ${{ secrets.CHAT_ID }}
  API_BOT: ${{ secrets.BOT_API }}

jobs:
  SLEEPYCI:
    if: "(! contains(toJSON(github.event.commits.*.message), '[skip-ci]'))"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write          # без этого релиз не создастся
    steps:
    - name: Creating Env!
      uses: actions/checkout@v4

    - name: Setting up Env!
      run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Export Vars
      run: |
          # скрипт ждёт строчные буквы, инпут приходит заглавными
          echo "DEVICE_TYPE=${DEV,,}" >> $GITHUB_ENV
          echo "KERNEL_TAG=${{ github.event.inputs.DEPLOY_TAG_TYPE }}" >> $GITHUB_ENV
      env:
        DEV: ${{ github.event.inputs.DEPLOY_DEVICE_TYPE }}

    - name: Building Kernel..
      run: |
          curl -sL https://raw.githubusercontent.com/doctorstrange2003/builder/refs/heads/main/build.sh > kernel.sh
          # вырезаем финальную уборку, иначе ZIP исчезнет вместе с out/ и zip/
          sed -i '/^rm -rf out zip error.log zipsigner-3.0.jar/d' kernel.sh
          chmod +x kernel.sh
          bash kernel.sh
      shell: bash

    - name: Collect artifacts
      run: |
          mkdir -p release
          cp zip/*-signed.zip release/
          cp out/arch/arm64/boot/Image.gz release/ || true
          cp out/arch/arm64/boot/dtbo.img release/ || true
          ls -lh release/

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.DEPLOY_TAG_TYPE }}
        name: SLEEPY_KERNEL-OSS ${{ github.event.inputs.DEPLOY_TAG_TYPE }} (DAVINCI)
        body: |
          Kernel: SLEEPY_KERNEL-OSS
          Device: Redmi K20 / Mi 9T (davinci)
          Build: ${{ github.run_number }} — commit `${{ github.sha }}`
        files: release/*
        draft: false
        prerelease: false
