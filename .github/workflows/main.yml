name: Sleepy Company CI!-2
on:
  workflow_dispatch:
    inputs:
      DEPLOY_DEVICE_TYPE:
        description: 'Deploy Device Type (davinci)'
        required: true
        default: 'davinci'
      DEPLOY_TAG_TYPE:
        description: 'Kernel version tag (example: v1 or v2)'
        required: true

env:
  DEVICE_TYPE: ${{ github.event.inputs.DEPLOY_DEVICE_TYPE }}
  KERNEL_TAG: ${{ github.event.inputs.DEPLOY_TAG_TYPE }}

jobs:
  SLEEPYCI:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write          # обязательно, иначе релиз не создастся
    steps:
    - uses: actions/checkout@v4

    - name: Setting up Env!
      run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Building Kernel..
      run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh
      shell: bash

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
          tag_name: ${{ github.event.inputs.DEPLOY_TAG_TYPE }}
          name: SleepyKernel ${{ github.event.inputs.DEPLOY_TAG_TYPE }} (DAVINCI)
          files: zip/*-signed.zip
          body: |
            Kernel: SLEEPY_KERNEL-OSS
            Device: Redmi K20 (davinci)
            Commit: ${{ github.sha }}
